<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>まとめてリネーム保存 | Game-making-tools</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e1729"><style>*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0e1729;color:#e8eefb}body{margin:0;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}main{max-width:900px;margin:auto}h1{font-size:clamp(24px,5vw,35px);margin:18px 0 6px}p{line-height:1.6;color:#b3c1d5}.back{color:#93d5fb}.panel{padding:18px;background:#17263b;border:1px solid #30435e;border-radius:17px;margin:18px 0}label{display:block;font-size:14px;margin:12px 0 7px;color:#d8e4ef}input,select,button{font:inherit}input[type=file],input[type=text],select,input[type=color]{width:100%;max-width:100%;padding:12px;background:#0c1829;border:1px solid #496078;border-radius:10px;color:#e8eefb}input[type=color]{height:48px}button,.download{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border:0;border-radius:10px;background:#71c5ed;color:#102137;font-weight:700;text-decoration:none;cursor:pointer;margin:7px 6px 7px 0}.download{background:#acf0ca}.download:focus-visible,button:focus-visible{outline:3px solid #fff}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d192a;padding:14px;border-radius:12px;font-size:13px}small,.note{color:#a8bbd1}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.item{padding:10px 0;border-bottom:1px solid #40506b}a{color:#a6defa}#result:not(:empty){margin-top:16px}</style></head><body><main><a class="back" href="./index.html">← ツール一覧へ</a><h1>まとめてリネーム保存</h1><p>元ファイルを変更せず、ファイル名の最後にある指定文字列を削除したコピーをZIPにまとめます。</p><section class="panel"><label>リネーム対象ファイルを選択（複数可）<input type="file" id="files" multiple></label><label>ファイル名から削除する文字列<input type="text" id="remove" placeholder="例：_copy"></label><button id="run">ZIPを作成する</button><p class="note">ブラウザでは任意の保存先フォルダへ直接コピーできないため、ZIP形式でまとめて保存します。</p></section><section id="result" aria-live="polite"></section></main><script src="./browser-utils.js"></script><script>
const input=document.getElementById("files"),textInput=document.getElementById("remove"),out=document.getElementById("result");
function splitName(name){const dot=name.lastIndexOf(".");return dot>0?[name.slice(0,dot),name.slice(dot)]:[name,""];}
function nameFor(name,needle){const [base,ext]=splitName(name);const i=needle?base.lastIndexOf(needle):-1;const next=i<0?base:base.slice(0,i)+base.slice(i+needle.length);return PWAUtils.safeName(next.trim()||"renamed")+ext;}
function preview(){
 const files=[...input.files],needle=textInput.value;out.replaceChildren();
 if(!files.length){out.textContent="ファイルを選択してください";return [];}
 const used=new Set(),result=[];
 for(const file of files){
  const newBase=nameFor(file.name,needle);let next=newBase,i=2;
  while(used.has(next)){const [b,e]=splitName(newBase);next=b+"_"+i+++e;}
  used.add(next);result.push({file,name:next});
  const p=document.createElement("div");p.className="item";p.textContent=file.name+" → "+next;out.append(p);
 }
 return result;
}
input.addEventListener("change",preview);textInput.addEventListener("input",preview);
document.getElementById("run").addEventListener("click",async()=>{
 const items=preview();if(!items.length)return;
 const btn=document.getElementById("run");btn.disabled=true;
 try{
 const zipItems=[];for(const item of items)zipItems.push({name:item.name,data:new Uint8Array(await item.file.arrayBuffer())});
 PWAUtils.saveLink(out,"一括リネーム.zip",PWAUtils.zip(zipItems),"application/zip");
 const p=document.createElement("p");p.textContent="元ファイルは変更していません。上の「一括リネーム.zip」を保存してください。";out.append(p);
 }catch(e){const p=document.createElement("p");p.textContent="失敗: "+String(e);out.append(p);}
 finally{btn.disabled=false;}
});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
