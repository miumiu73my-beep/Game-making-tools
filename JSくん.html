<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JSくん | Game-making-tools</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e1729"><style>*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0e1729;color:#e8eefb}body{margin:0;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}main{max-width:900px;margin:auto}h1{font-size:clamp(24px,5vw,35px);margin:18px 0 6px}p{line-height:1.6;color:#b3c1d5}.back{color:#93d5fb}.panel{padding:18px;background:#17263b;border:1px solid #30435e;border-radius:17px;margin:18px 0}label{display:block;font-size:14px;margin:12px 0 7px;color:#d8e4ef}input,select,button{font:inherit}input[type=file],input[type=text],select,input[type=color]{width:100%;max-width:100%;padding:12px;background:#0c1829;border:1px solid #496078;border-radius:10px;color:#e8eefb}input[type=color]{height:48px}button,.download{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border:0;border-radius:10px;background:#71c5ed;color:#102137;font-weight:700;text-decoration:none;cursor:pointer;margin:7px 6px 7px 0}.download{background:#acf0ca}.download:focus-visible,button:focus-visible{outline:3px solid #fff}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d192a;padding:14px;border-radius:12px;font-size:13px}small,.note{color:#a8bbd1}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.item{padding:10px 0;border-bottom:1px solid #40506b}a{color:#a6defa}#result:not(:empty){margin-top:16px}</style></head><body><main><a class="back" href="./index.html">← ツール一覧へ</a><h1>JSくん</h1><p>元のシナリオ変換ロジックを使い、md / txt の会話・制御文を構造化します。ブラウザ上で処理し、JSONとJSまたはZIPで保存します。</p><section class="panel"><label>シナリオファイル（複数可）<input id="files" type="file" accept=".md,.txt,.js,text/plain" multiple></label><button id="run">変換して保存リンクを作成</button><p class="note">JSON版も出力します。もとの .js を選んだ場合は加工せずZIPにコピーします。</p></section><section id="result" aria-live="polite"></section></main><script src="./browser-utils.js"></script><script>
function parseScenarioText(text) {
  const normalized = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  const lines = normalized.split("\n");
  const entries = [];
  let insideCodeFence = false;

  const stats = {
    totalLines: lines.length,
    usedLines: 0,
    dialogueCount: 0,
    actionCount: 0,
    controlCount: 0,
    skippedLines: 0,
  };

  for (let index = 0; index < lines.length; index++) {
    let line = stripBom(lines[index]).trim();
    const sourceLine = index + 1;

    if (!line) {
      stats.skippedLines++;
      continue;
    }

    if (/^```/.test(line)) {
      insideCodeFence = !insideCodeFence;
      stats.skippedLines++;
      continue;
    }
    if (insideCodeFence) {
      stats.skippedLines++;
      continue;
    }

    line = normalizeDecorativePrefix(line);

    if (!line) {
      stats.skippedLines++;
      continue;
    }

    if (CONFIG.skipCommentLines && /^(\/\/|;|※|注:|注記:)/.test(line)) {
      stats.skippedLines++;
      continue;
    }

    const control = parseControlLine(line, sourceLine);
    if (control) {
      entries.push(control);
      stats.usedLines++;
      stats.controlCount++;
      continue;
    }

    const dialogue = parseDialogueLine(line, sourceLine);
    if (dialogue) {
      entries.push(dialogue);
      stats.usedLines++;
      stats.dialogueCount++;
      continue;
    }

    entries.push(makeActionEntry(line, sourceLine));
    stats.usedLines++;
    stats.actionCount++;
  }

  return { entries, stats };
}

function parseControlLine(line, sourceLine) {
  const m = line.match(/^<<\s*([A-Z_]+)\s*:?\s*(.*?)\s*>>$/i);
  if (!m) return null;

  return attachLineNumber(
    {
      type: "control",
      command: m[1].toUpperCase(),
      value: m[2] || "",
    },
    sourceLine
  );
}

function parseDialogueLine(line, sourceLine) {
  const start = line.indexOf("「");
  const end = line.lastIndexOf("」");
  if (start <= 0 || end <= start) return null;

  const speaker = cleanupField(line.slice(0, start));
  const text = cleanupField(line.slice(start + 1, end));
  const tail = cleanupField(line.slice(end + 1));

  const meta = splitMeta(tail);
  return attachLineNumber(
    {
      type: "dialogue",
      speaker,
      text,
      expression: meta.expression,
      background: meta.background,
      note: meta.note,
    },
    sourceLine
  );
}

function makeActionEntry(line, sourceLine) {
  return attachLineNumber(
    {
      type: "action",
      text: cleanupField(line),
    },
    sourceLine
  );
}

function splitMeta(tail) {
  if (!tail) return { expression: "", background: "", note: "" };

  const cleanTail = tail.replace(/^[：:\-\s]+/, "").trim();
  if (!cleanTail) return { expression: "", background: "", note: "" };

  const parts = cleanTail
    .split(/[，,]/)
    .map((v) => cleanupField(v))
    .filter(Boolean);

  return {
    expression: parts[0] || "",
    background: parts[1] || "",
    note: parts.slice(2).join(", "),
  };
}

function buildJSOutput({ sourcePath, entries, stats, warnings }) {
  const sourceName = getFileName(sourcePath);
  const payload = {
    sourceFile: sourceName,
    generatedAt: formatDate(new Date()),
    stats,
    warnings,
    entries,
  };

  const body = JSON.stringify(payload, null, 2);
  return [
    `// Auto-generated by JSくん`,
    `// source: ${sourceName}`,
    ``,
    `const scriptData = ${body};`,
    ``,
    `if (typeof module !== "undefined") {`,
    `  module.exports = scriptData;`,
    `}`,
    ``,
  ].join("\n");
}

function writeReport(fm, outputDir, results) {
  const lines = [];
  lines.push(`JSくん 変換レポート`);
  lines.push(`生成日時: ${formatDate(new Date())}`);
  lines.push("");

  for (const result of results) {
    lines.push(result.ok ? "[OK]" : "[NG]");
    lines.push(`入力: ${result.input}`);
    if (result.ok) {
      lines.push(`種類: ${result.kind || "converted"}`);
      lines.push(`出力: ${result.output}`);
      lines.push(
        `件数: dialogue=${result.stats.dialogueCount}, action=${result.stats.actionCount}, control=${result.stats.controlCount}`
      );
      if (result.warnings && result.warnings.length) {
        lines.push(`警告: ${result.warnings.join(" / ")}`);
      }
    } else {
      lines.push(`理由: ${result.reason}`);
    }
    lines.push("");
  }

  const reportPath = fm.joinPath(outputDir, "_JSくん_変換レポート.txt");
  fm.writeString(reportPath, lines.join("\n"));
  return reportPath;
}

async function presentSummary(results, outputDir, reportPath) {
  const okCount = results.filter((r) => r.ok).length;
  const ngCount = results.length - okCount;

  const lines = [];
  lines.push(`保存先:`);
  lines.push(outputDir);
  lines.push("");
  lines.push(`成功: ${okCount}件 / 失敗: ${ngCount}件`);

  for (const result of results) {
    if (!result.ok) {
      lines.push(`・NG: ${getFileName(result.input)} → ${result.reason}`);
      continue;
    }

    if (result.kind === "copied") {
      lines.push(`・OK: ${getFileName(result.input)} → ${result.outputName} (そのままコピー)`);
      continue;
    }

    lines.push(
      `・OK: ${getFileName(result.input)} → ${result.outputName} (会話${result.stats.dialogueCount}/動作${result.stats.actionCount}/制御${result.stats.controlCount})`
    );
  }

  lines.push("");
  lines.push(`レポート:`);
  lines.push(reportPath);

  const alert = new Alert();
  alert.title = "JSくん";
  alert.message = lines.join("\n");
  alert.addAction("OK");
  alert.addAction("レポートを見る");
  const choice = await alert.presentAlert();
  if (choice === 1) {
    await QuickLook.present(reportPath, false);
  }
}

async function showMessage(title, message) {
  const alert = new Alert();
  alert.title = title;
  alert.message = message;
  alert.addAction("OK");
  await alert.presentAlert();
}

function normalizeDecorativePrefix(line) {
  let s = line.trim();
  s = s.replace(/^#{1,6}\s*/, "");
  s = s.replace(/^[-*•]\s+/, "");
  s = s.replace(/^\d+[.)]\s+/, "");
  return s.trim();
}

function cleanupField(value) {
  return String(value || "")
    .replace(/^\uFEFF/, "")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function stripBom(text) {
  return String(text || "").replace(/^\uFEFF/, "");
}

function attachLineNumber(obj, sourceLine) {
  if (CONFIG.includeSourceLineNumber) obj.sourceLine = sourceLine;
  return obj;
}

function normalizePossibleFileURL(value) {
  if (typeof value !== "string") return String(value || "");
  if (!/^file:\/\//i.test(value)) return value;

  let path = value.replace(/^file:\/\//i, "");
  path = path.replace(/^localhost/i, "");
  try {
    path = decodeURIComponent(path);
  } catch (_) {}
  return path;
}

function hasPrefix(bytes, prefix) {
  if (bytes.length < prefix.length) return false;
  for (let i = 0; i < prefix.length; i++) {
    if (bytes[i] !== prefix[i]) return false;
  }
  return true;
}

function uniqueStrings(list) {
  const seen = {};
  const out = [];
  for (const item of list) {
    const key = String(item);
    if (seen[key]) continue;
    seen[key] = true;
    out.push(item);
  }
  return out;
}

function getFileName(path) {
  const parts = String(path).split("/");
  return parts[parts.length - 1] || path;
}

function getBaseName(path) {
  const fileName = getFileName(path);
  const dot = fileName.lastIndexOf(".");
  return dot >= 0 ? fileName.slice(0, dot) : fileName;
}

function getExtension(path) {
  const fileName = getFileName(path).toLowerCase();
  const dot = fileName.lastIndexOf(".");
  return dot >= 0 ? fileName.slice(dot + 1) : "";
}

function sanitizeFileName(name) {
  return String(name || "untitled")
    .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "_")
    .replace(/\s+/g, "_")
    .trim();
}

function countLines(text) {
  if (!text) return 0;
  return String(text).replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n").length;
}

function formatDate(date) {
  const yyyy = date.getFullYear();
  const mm = pad2(date.getMonth() + 1);
  const dd = pad2(date.getDate());
  const hh = pad2(date.getHours());
  const mi = pad2(date.getMinutes());
  const ss = pad2(date.getSeconds());
  return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
}

function pad2(n) {
  return n < 10 ? `0${n}` : String(n);
}

const CONFIG={skipCommentLines:true,includeSourceLineNumber:true};
const input=document.getElementById("files"),out=document.getElementById("result"),btn=document.getElementById("run");
btn.addEventListener("click",async()=>{
 const files=[...input.files];if(!files.length){out.textContent="入力ファイルを選択してください。";return;}
 btn.disabled=true;out.replaceChildren();const collected=[],report=[];
 try{
 for(const file of files){
 try{
  const ext=file.name.split(".").pop().toLowerCase();if(!["md","txt","js"].includes(ext))throw Error("対応形式は .md / .txt / .js です");
  if(ext==="js"){
   const data=new Uint8Array(await file.arrayBuffer());collected.push({name:file.name,data});
   report.push("コピー: "+file.name+"（.js原本は変換しません）");
   continue;
  }
  const contents=await file.text(),parsed=parseScenarioText(contents),warnings=[];
  if(file.size>2*1024*1024)warnings.push("大きな入力です。分割も検討してください");
  const text=buildJSOutput({sourcePath:file.name,entries:parsed.entries,stats:parsed.stats,warnings});
  const base=PWAUtils.safeName(file.name.replace(/\.[^.]+$/,""));
  collected.push({name:base+"__from_"+ext+".js",data:PWAUtils.encoder.encode(text)});
  const obj={sourceFile:file.name,entries:parsed.entries,stats:parsed.stats,warnings};
  const json=JSON.stringify(obj,null,2);
  const article=document.createElement("div");article.className="item";
  const line=document.createElement("p");line.textContent=file.name+" — 会話 "+parsed.stats.dialogueCount+" / アクション "+parsed.stats.actionCount+" / 制御 "+parsed.stats.controlCount;article.append(line);
  PWAUtils.saveLink(article,base+".json",json,"application/json");
  PWAUtils.saveLink(article,base+"__from_"+ext+".js",text,"text/javascript");
  out.append(article);report.push(line.textContent);
 }catch(error){report.push("エラー: "+file.name+" / "+error);}
 }
 if(collected.length){const zip=PWAUtils.zip(collected);PWAUtils.saveLink(out,"JSくん_出力.zip",zip,"application/zip");}
 const pre=document.createElement("pre");pre.textContent=report.join("\n");out.append(pre);
 }finally{btn.disabled=false;}
});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
