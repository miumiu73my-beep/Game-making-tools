<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PNGの背景透過 | Game-making-tools</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0e1729"><style>*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0e1729;color:#e8eefb}body{margin:0;min-height:100dvh;padding:calc(20px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}main{max-width:900px;margin:auto}h1{font-size:clamp(24px,5vw,35px);margin:18px 0 6px}p{line-height:1.6;color:#b3c1d5}.back{color:#93d5fb}.panel{padding:18px;background:#17263b;border:1px solid #30435e;border-radius:17px;margin:18px 0}label{display:block;font-size:14px;margin:12px 0 7px;color:#d8e4ef}input,select,button{font:inherit}input[type=file],input[type=text],select,input[type=color]{width:100%;max-width:100%;padding:12px;background:#0c1829;border:1px solid #496078;border-radius:10px;color:#e8eefb}input[type=color]{height:48px}button,.download{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border:0;border-radius:10px;background:#71c5ed;color:#102137;font-weight:700;text-decoration:none;cursor:pointer;margin:7px 6px 7px 0}.download{background:#acf0ca}.download:focus-visible,button:focus-visible{outline:3px solid #fff}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d192a;padding:14px;border-radius:12px;font-size:13px}small,.note{color:#a8bbd1}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.item{padding:10px 0;border-bottom:1px solid #40506b}a{color:#a6defa}#result:not(:empty){margin-top:16px}</style></head><body><main><a class="back" href="./index.html">← ツール一覧へ</a><h1>PNGの背景透過</h1><p>元のScriptable版と同じ外周色推定・背景透過ロジックで画像を処理します。透過したPNGを個別またはZIPで保存できます。</p><section class="panel"><label>PNG画像（複数可）<input id="files" type="file" accept=".png,image/png" multiple></label><label>透明化した場所に指定するRGB色（透明度は0）<input id="color" type="color" value="#ff00ff"></label><button id="run">透過処理を始める</button><p class="note">処理結果は元画像を上書きせず、新しいPNGとして保存されます。</p></section><section id="result" aria-live="polite"></section></main><script src="./browser-utils.js"></script><script>
const SETTINGS = {
  // 外周背景の判定の強さ。抜けない時だけ少し上げる
  tolerance: 22,

  // 背景色推定用の量子化幅
  borderBucketStep: 8,

  // 穴として認める最小面積
  // 立ち絵の白服を誤検出しにくくするため、かなり大きめにしています
  holeMinArea: 1200,
  holeMinAreaRatio: 0.02,

  // 穴として認める最小の幅・高さ比
  holeMinWidthRatio: 0.18,
  holeMinHeightRatio: 0.18,

  // 穴領域の色ばらつき上限
  // UIの大きな空白は低く、服や髪のハイライトは高くなりやすいです
  holeMaxStd: 8,

  // 穴の詰まり具合。低すぎると細い筋も穴扱いしやすくなるので少しだけ制限
  holeMinFillRatio: 0.18,
}

  window.processBackground = async function(PNG_BASE64,TARGET,SETTINGS) {
    
    
    

    function colorDistSq(r1, g1, b1, r2, g2, b2) {
      const dr = r1 - r2;
      const dg = g1 - g2;
      const db = b1 - b2;
      return dr * dr + dg * dg + db * db;
    }

    function bucketKey(r, g, b, step) {
      return [Math.round(r / step), Math.round(g / step), Math.round(b / step)].join('_');
    }

    function pushNeighbors4(p, w, h, out) {
      const x = p % w;
      const y = (p / w) | 0;
      if (x > 0) out.push(p - 1);
      if (x + 1 < w) out.push(p + 1);
      if (y > 0) out.push(p - w);
      if (y + 1 < h) out.push(p + w);
    }

    function run() {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          try {
            const w = img.width;
            const h = img.height;
            const total = w * h;

            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(img, 0, 0);

            const src = ctx.getImageData(0, 0, w, h);
            const data = src.data;

            // 1) 外周から背景色を推定
            const buckets = new Map();
            const step = SETTINGS.borderBucketStep;

            function sampleBorder(x, y) {
              const i = (y * w + x) * 4;
              const a = data[i + 3];
              if (a === 0) return;
              const r = data[i], g = data[i + 1], b = data[i + 2];
              const key = bucketKey(r, g, b, step);
              let v = buckets.get(key);
              if (!v) v = { count: 0, r: 0, g: 0, b: 0 };
              v.count++;
              v.r += r;
              v.g += g;
              v.b += b;
              buckets.set(key, v);
            }

            for (let x = 0; x < w; x++) {
              sampleBorder(x, 0);
              sampleBorder(x, h - 1);
            }
            for (let y = 1; y < h - 1; y++) {
              sampleBorder(0, y);
              sampleBorder(w - 1, y);
            }

            // すでに全部透過などで外周色が拾えない場合はそのまま出力
            if (buckets.size === 0) {
              const out0 = canvas.toDataURL('image/png').split(',')[1];
              resolve(JSON.stringify({ ok: true, pngBase64: out0, stats: { width: w, height: h, alreadyTransparent: true } }));
              return;
            }

            let best = null;
            for (const [, v] of buckets) {
              if (!best || v.count > best.count) best = v;
            }

            const bg = {
              r: Math.round(best.r / best.count),
              g: Math.round(best.g / best.count),
              b: Math.round(best.b / best.count),
            };
            const tolSq = SETTINGS.tolerance * SETTINGS.tolerance;

            // 2) 背景候補マスク
            // 透過済みピクセルは背景として扱う
            const candidate = new Uint8Array(total);
            for (let p = 0, i = 0; p < total; p++, i += 4) {
              const a = data[i + 3];
              if (a === 0) {
                candidate[p] = 1;
                continue;
              }
              if (colorDistSq(data[i], data[i + 1], data[i + 2], bg.r, bg.g, bg.b) <= tolSq) {
                candidate[p] = 1;
              }
            }

            // 3) 外周からつながる背景だけをまず取得
            const outer = new Uint8Array(total);
            const queue = new Int32Array(total);
            let head = 0;
            let tail = 0;

            function enqueueIfOuter(x, y) {
              const p = y * w + x;
              if (!candidate[p] || outer[p]) return;
              outer[p] = 1;
              queue[tail++] = p;
            }

            for (let x = 0; x < w; x++) {
              enqueueIfOuter(x, 0);
              enqueueIfOuter(x, h - 1);
            }
            for (let y = 1; y < h - 1; y++) {
              enqueueIfOuter(0, y);
              enqueueIfOuter(w - 1, y);
            }

            while (head < tail) {
              const p = queue[head++];
              const x = p % w;
              const y = (p / w) | 0;
              if (x > 0) {
                const np = p - 1;
                if (candidate[np] && !outer[np]) { outer[np] = 1; queue[tail++] = np; }
              }
              if (x + 1 < w) {
                const np = p + 1;
                if (candidate[np] && !outer[np]) { outer[np] = 1; queue[tail++] = np; }
              }
              if (y > 0) {
                const np = p - w;
                if (candidate[np] && !outer[np]) { outer[np] = 1; queue[tail++] = np; }
              }
              if (y + 1 < h) {
                const np = p + w;
                if (candidate[np] && !outer[np]) { outer[np] = 1; queue[tail++] = np; }
              }
            }

            // 4) 最終マスクに外周背景を入れる
            const finalMask = new Uint8Array(total);
            let maskedCount = 0;
            for (let p = 0; p < total; p++) {
              if (outer[p]) {
                finalMask[p] = 1;
                maskedCount++;
              }
            }

            // 5) 大きくて均一な閉じた穴だけ追加で透過
            const minHoleArea = Math.max(SETTINGS.holeMinArea, Math.floor(total * SETTINGS.holeMinAreaRatio));
            const visited = new Uint8Array(total);
            const stack = new Int32Array(total);
            const comp = [];
            let acceptedHoles = 0;

            for (let start = 0; start < total; start++) {
              if (!candidate[start] || outer[start] || visited[start]) continue;

              let sp = 0;
              stack[sp++] = start;
              visited[start] = 1;
              comp.length = 0;

              let area = 0;
              let sumR = 0, sumG = 0, sumB = 0;
              let sumR2 = 0, sumG2 = 0, sumB2 = 0;
              let minX = w, minY = h, maxX = 0, maxY = 0;
              let touchesEdge = false;

              while (sp > 0) {
                const p = stack[--sp];
                comp.push(p);
                area++;

                const x = p % w;
                const y = (p / w) | 0;
                if (x === 0 || y === 0 || x === w - 1 || y === h - 1) touchesEdge = true;
                if (x < minX) minX = x;
                if (y < minY) minY = y;
                if (x > maxX) maxX = x;
                if (y > maxY) maxY = y;

                const i = p * 4;
                const a = data[i + 3];
                const r = data[i], g = data[i + 1], b = data[i + 2];
                if (a !== 0) {
                  sumR += r; sumG += g; sumB += b;
                  sumR2 += r * r; sumG2 += g * g; sumB2 += b * b;
                }

                if (x > 0) {
                  const np = p - 1;
                  if (candidate[np] && !outer[np] && !visited[np]) { visited[np] = 1; stack[sp++] = np; }
                }
                if (x + 1 < w) {
                  const np = p + 1;
                  if (candidate[np] && !outer[np] && !visited[np]) { visited[np] = 1; stack[sp++] = np; }
                }
                if (y > 0) {
                  const np = p - w;
                  if (candidate[np] && !outer[np] && !visited[np]) { visited[np] = 1; stack[sp++] = np; }
                }
                if (y + 1 < h) {
                  const np = p + w;
                  if (candidate[np] && !outer[np] && !visited[np]) { visited[np] = 1; stack[sp++] = np; }
                }
              }

              if (touchesEdge) continue;
              if (area < minHoleArea) continue;

              const boxW = maxX - minX + 1;
              const boxH = maxY - minY + 1;
              const fillRatio = area / (boxW * boxH);
              if (boxW / w < SETTINGS.holeMinWidthRatio) continue;
              if (boxH / h < SETTINGS.holeMinHeightRatio) continue;
              if (fillRatio < SETTINGS.holeMinFillRatio) continue;

              const meanR = sumR / area;
              const meanG = sumG / area;
              const meanB = sumB / area;
              const stdR = Math.sqrt(Math.max(0, (sumR2 / area) - meanR * meanR));
              const stdG = Math.sqrt(Math.max(0, (sumG2 / area) - meanG * meanG));
              const stdB = Math.sqrt(Math.max(0, (sumB2 / area) - meanB * meanB));
              const avgStd = (stdR + stdG + stdB) / 3;

              if (avgStd > SETTINGS.holeMaxStd) continue;

              for (const p of comp) {
                if (!finalMask[p]) {
                  finalMask[p] = 1;
                  maskedCount++;
                }
              }
              acceptedHoles++;
            }

            // 6) 指定色にそろえてから、その色を透過
            for (let p = 0, i = 0; p < total; p++, i += 4) {
              if (!finalMask[p]) continue;
              data[i] = TARGET.r;
              data[i + 1] = TARGET.g;
              data[i + 2] = TARGET.b;
              data[i + 3] = 0;
            }

            ctx.putImageData(src, 0, 0);
            const out = canvas.toDataURL('image/png').split(',')[1];
            resolve(JSON.stringify({
              ok: true,
              pngBase64: out,
              stats: {
                width: w,
                height: h,
                bg,
                maskedPixels: maskedCount,
                acceptedHoles,
              }
            }));
          } catch (err) {
            resolve(JSON.stringify({ ok: false, error: String(err) }));
          }
        };
        img.onerror = () => {
          resolve(JSON.stringify({ ok: false, error: '画像の読み込みに失敗しました' }));
        };
        img.src = 'data:image/png;base64,' + PNG_BASE64;
      });
    }

    return JSON.parse(await run());
  };

function fromFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(file);});}
function parseColor(hex){const h=hex.slice(1);return{hex,r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
document.getElementById("run").addEventListener("click",async()=>{
 const files=[...document.getElementById("files").files],out=document.getElementById("result"),btn=document.getElementById("run");
 if(!files.length){out.textContent="PNG画像を選択してください";return;}
 btn.disabled=true;out.replaceChildren();const list=[],failed=[];
 try{
 const target=parseColor(document.getElementById("color").value);
 for(let i=0;i<files.length;i++){
  const f=files[i];if(!f.name.toLowerCase().endsWith(".png")){failed.push(f.name+": PNGのみ対応");continue;}
  const status=document.createElement("p");status.textContent=f.name+" を処理中 ("+(i+1)+"/"+files.length+")";out.append(status);
  try{
   const base64=await fromFile(f),result=await window.processBackground(base64,target,SETTINGS);
   if(!result.ok)throw Error(result.error||"処理に失敗しました");
   const bytes=PWAUtils.bytesFromBase64(result.pngBase64);
   list.push({name:f.name,data:bytes});
   const panel=document.createElement("div");panel.className="item";
   const p=document.createElement("p");p.textContent=f.name+" — 透過 "+(result.stats.maskedPixels??0)+" px";panel.append(p);
   const img=new Image();img.className="preview";img.alt="透過画像プレビュー";img.src="data:image/png;base64,"+result.pngBase64;panel.append(img,document.createElement("div"));
   PWAUtils.saveLink(panel,f.name,new Blob([bytes],{type:"image/png"}),"image/png");out.append(panel);
   status.remove();
  }catch(e){status.textContent="失敗: "+f.name+" / "+String(e);failed.push(f.name);}
 }
 if(list.length)PWAUtils.saveLink(out,"背景透過済みPNG.zip",PWAUtils.zip(list),"application/zip");
 const p=document.createElement("p");p.textContent="完了: 成功 "+list.length+" / 失敗 "+failed.length;out.prepend(p);
 }finally{btn.disabled=false;}
});
</script><script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
